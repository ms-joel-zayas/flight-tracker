<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app" id="app" data-mode="live">

  <!-- Header: title on the left, live/replay status on the right -->
  <header class="header">
    <h1>FLIGHT TRACKER</h1>
    <div class="header__right">
      <span class="updated" id="updated-text" hidden></span>
      <p class="status-pill" id="status-text">LOADING</p>
    </div>
  </header>

  <div class="layout">

    <!-- Sidebar: search, filters, flight list, detail panel -->
    <aside class="sidebar">

      <div class="search">
        <label for="search-input" class="visually-hidden">Search flights</label>
        <input type="search" id="search-input" class="field" placeholder="Search flight # or call-sign">
      </div>

      <div class="filters">
        <label for="filter-origin" class="visually-hidden">Origin</label>
        <select id="filter-origin" class="field">
          <option value="">Origin</option>
          <option value="ATL">ATL</option>
          <option value="BOS">BOS</option>
          <option value="DEN">DEN</option>
          <option value="JFK">JFK</option>
          <option value="LAX">LAX</option>
          <option value="ORD">ORD</option>
          <option value="SEA">SEA</option>
          <option value="SFO">SFO</option>
        </select>

        <label for="filter-dest" class="visually-hidden">Destination</label>
        <select id="filter-dest" class="field">
          <option value="">Dest</option>
          <option value="ATL">ATL</option>
          <option value="BOS">BOS</option>
          <option value="DEN">DEN</option>
          <option value="JFK">JFK</option>
          <option value="LAX">LAX</option>
          <option value="ORD">ORD</option>
          <option value="SEA">SEA</option>
          <option value="SFO">SFO</option>
        </select>
      </div>

      <ul class="flight-list" id="flight-list"></ul>

      <p id="empty-message" hidden>No flights match</p>

      <section class="detail" id="detail-panel" hidden>
        <div class="detail__top">
          <h2 id="detail-title">Flight</h2>
          <button class="btn" type="button" id="detail-close" aria-label="Close details">×</button>
        </div>

        <dl>
          <dt>Origin</dt>
          <dd id="detail-origin"></dd>

          <dt>Destination</dt>
          <dd id="detail-dest"></dd>

          <dt>Callsign</dt>
          <dd id="detail-callsign"></dd>

          <dt>Departed</dt>
          <dd id="detail-departed"></dd>

          <dt>ETA</dt>
          <dd id="detail-eta"></dd>

          <dt>Altitude</dt>
          <dd id="detail-altitude"></dd>

          <dt>Speed</dt>
          <dd id="detail-speed"></dd>

          <dt>Heading</dt>
          <dd id="detail-heading"></dd>

          <dt>Progress</dt>
          <dd id="detail-progress"></dd>
        </dl>
      </section>

    </aside>

    <!-- Map (JavaScript adds the markers and airport labels here) -->
    <div class="map" id="map-area">
      <span class="badge count-badge" id="count-badge">0 AIRCRAFT</span>
      <div class="mode-banner" id="mode-banner" hidden>REPLAY · NOT LIVE</div>
    </div>

  </div><!-- end .layout -->

  <!-- Live / replay controls: under the map, not on top of it -->
  <div class="playback-bar">
    <div class="playback-row">
      <button class="btn" id="mode-live" type="button" aria-pressed="true">● LIVE</button>
      <button class="btn" id="mode-replay" type="button" aria-pressed="false">REPLAY</button>

      <label for="playback-date">DATE</label>
      <button class="btn" id="playback-prev-day" type="button" aria-label="Previous day">◀ DAY</button>
      <input type="date" id="playback-date" class="field">
      <button class="btn" id="playback-next-day" type="button" aria-label="Next day">DAY ▶</button>

      <span class="badge" id="playback-time">00:00</span>

      <label for="playback-speed">SPEED</label>
      <select id="playback-speed" class="field">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="5">5x</option>
        <option value="10">10x</option>
      </select>
    </div>

    <div class="playback-row">
      <button class="btn" id="playback-start" type="button" aria-label="Jump to start">|◀</button>
      <button class="btn" id="playback-toggle" type="button">PLAY</button>
      <button class="btn" id="playback-end" type="button" aria-label="Jump to end">▶|</button>
      <input type="range" id="playback-timeline" min="0" max="95" value="0" step="1" aria-label="Playback timeline">
    </div>

    <div class="playback-labels">
      <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
    </div>
  </div>

</div><!-- end .app -->

<script src="js/app.js"></script>
</body>
</html>
