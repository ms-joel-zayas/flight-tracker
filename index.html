<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Tracker</title>
  <!--
    WHY: <head> holds information ABOUT the page, not things you see on it.
    The <link> below connects this page to your CSS file. Without it the
    page shows in plain browser style no matter what you write in styles.css.
  -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!--
  =====================================================================
  FLIGHT TRACKER — STARTER (HTML = structure)
  =====================================================================
  HTML decides WHAT is on the screen. It does not decide how it looks
  (that is CSS) or what happens on a click (that is JavaScript).

  Build the page top to bottom in the order of the steps below. After each
  step, save and look at the browser before moving on.
  Compare with the finished version on the v1-final branch when you are stuck.

  Tips:
  - Use real elements for real jobs: <button> for things you click,
    <input> and <select> for things you type or pick, <ul> for lists.
  - Give an id="..." to anything JavaScript needs to find later.
  - Give a class="..." to anything CSS needs to style.

  NEW: the flight list, the map markers and the airport labels are no longer
  typed here. JavaScript builds them from data/flights.json.
-->

<!-- STEP 1 — App wrapper
     WHY: One outer <div> holds the whole app so CSS can size it to fill the
     browser window. Put everything in STEPS 2-5 inside it.
     YOUR CODE: <div class="app" id="app"> ... </div>                          -->
<div class="app" id="app" data-panel="closed">

  <!-- STEP 2 — Header
       WHY: The title and status live at the top so users always know where
       they are and whether the data is live.
       YOUR CODE: a <header> containing an <h1> with "FLIGHT TRACKER" and a
       <p> for the connection status (for example "LIVE").
       Give the status <p> an id (for example "status-text") so JavaScript can
       change its text later.                                                  -->
  <header class="header">
    <h1>FLIGHT TRACKER</h1>
    <p class="status-pill" id="status-text">LOADING</p>
  </header>

  <div class="layout">

    <!-- STEP 3 — Sidebar (left panel)
         WHY: Search, filters and the flight list belong together in one column.
         YOUR CODE: an <aside class="sidebar"> that contains:
           a) Search: an <input type="search"> with a <label> (the label can be
              visually hidden, but it must exist for screen readers).
           b) Filters: two <select> elements, "Origin" and "Dest", each with a
              first empty option and then airport codes (ATL, BOS, DEN, JFK,
              LAX, ORD, SEA, SFO).
           c) Flight list: a <ul> where each <li> holds one <button> per flight.
              Start with just 2 or 3 flights. Show the flight name (AC 2210)
              and route (BOS → ORD).
              Store extra details on the button with data-* attributes, such as
              data-origin="BOS" data-dest="ORD". JavaScript can read these
              later, so you do not need a database yet.
           d) Empty message: a <p hidden> saying "No flights match" that
              JavaScript shows when a search finds nothing.                       -->
    <aside class="sidebar">

      <!-- a) Search -->
      <div class="search">
        <label for="search-input" class="visually-hidden">Search flights</label>
        <input type="search" id="search-input" class="field" placeholder="Search flight # or call-sign">
      </div>

      <!-- b) Filters -->
      <div class="filters">
        <label for="filter-origin" class="visually-hidden">Origin</label>
        <select id="filter-origin" class="field">
          <option value="">Origin</option>
          <option value="ATL">ATL</option>
          <option value="BOS">BOS</option>
          <option value="DEN">DEN</option>
          <option value="JFK">JFK</option>
          <option value="LAX">LAX</option>
          <option value="ORD">ORD</option>
          <option value="SEA">SEA</option>
          <option value="SFO">SFO</option>
        </select>

        <label for="filter-dest" class="visually-hidden">Destination</label>
        <select id="filter-dest" class="field">
          <option value="">Dest</option>
          <option value="ATL">ATL</option>
          <option value="BOS">BOS</option>
          <option value="DEN">DEN</option>
          <option value="JFK">JFK</option>
          <option value="LAX">LAX</option>
          <option value="ORD">ORD</option>
          <option value="SEA">SEA</option>
          <option value="SFO">SFO</option>
        </select>
      </div>

      <!-- c) Flight list (empty on purpose: JavaScript adds one <li> per flight) -->
      <ul class="flight-list" id="flight-list"></ul>

      <!-- d) Empty message -->
      <p id="empty-message" hidden>No flights match</p>

      <!-- STEP 4 — Detail panel
           WHY: When a flight is picked, the user needs more information about it.
           YOUR CODE: a <section> (hidden at first) with a title, a close <button>,
           and <dl> (description list) rows for origin, destination, departed,
           ETA, altitude and speed. Put an id on every value that JavaScript will
           fill in.                                                                -->
      <section class="detail" id="detail-panel" hidden>
        <div class="detail__top">
          <h2 id="detail-title">Flight</h2>
          <button class="btn" type="button" id="detail-close" aria-label="Close details">×</button>
        </div>

        <dl>
          <dt>Origin</dt>
          <dd id="detail-origin"></dd>

          <dt>Destination</dt>
          <dd id="detail-dest"></dd>

          <dt>Callsign</dt>
          <dd id="detail-callsign"></dd>

          <dt>Departed</dt>
          <dd id="detail-departed"></dd>

          <dt>ETA</dt>
          <dd id="detail-eta"></dd>

          <dt>Altitude</dt>
          <dd id="detail-altitude"></dd>

          <dt>Speed</dt>
          <dd id="detail-speed"></dd>

          <dt>Heading</dt>
          <dd id="detail-heading"></dd>

          <dt>Progress</dt>
          <dd id="detail-progress"></dd>
        </dl>
      </section>

    </aside>

    <!-- STEP 5 — Map area
         WHY: The map is the main view. For now it is a placeholder, not a real map.
         YOUR CODE: a <section class="map"> containing:
           a) A count badge, e.g. "8 AIRCRAFT" (give it an id).
           b) One <button class="marker"> per flight. Reuse the same flight ids
              as in the list so the two stay linked (data-id="AC2210").
           c) A few airport labels using <span>.                                  -->
    <div class="map" id="map-area">
      <!-- a) Count badge. The markers (b) and airport labels (c) are added here by JavaScript. -->
      <span class="badge count-badge" id="count-badge">0 AIRCRAFT</span>
    </div>

  </div>
</div>

<!-- STEP 6 — Connect JavaScript
     WHY: Put the <script> LAST, just before </body>. The browser reads the
     page top to bottom, so the elements must exist before JavaScript tries
     to find them.
     YOUR CODE: <script src="js/app.js"></script>                              -->
<script src="js/app.js"></script>
</body>
</html>
